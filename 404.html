<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Texas Power Outages</title>
<script>
  // GitHub Pages has no server-side router, so any path other than "/" (e.g.
  // /tx-utility-map/dallas) lands here instead of a 404 page. Redirect back to
  // index.html with the intended path encoded in the query string; index.html's
  // decode script restores the pretty URL via history.replaceState.
  // See: https://github.com/rafgraph/spa-github-pages
  var pathSegmentsToKeep = 1; // keep "/tx-utility-map" (the repo name segment)
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
